<p class="bey-style-guide-description text-muted mb-3">
    {{ 'angular-components-style-guide.account-data.example' | translate }}
</p>

<div class="d-flex gap-2 mb-3">
    @for (button of buttons(); track button.label) {
        <button
            class="btn btn-sm"
            type="button"
            [attr.aria-pressed]="button.isPrimary"
            [class.btn-dark]="button.isPrimary"
            [class.btn-outline-dark]="!button.isPrimary"
            (click)="button.action()"
        >
            {{ button.label | translate }}
        </button>
    }
</div>

<div class="bey-style-guide-frame p-3">
    <bey-account-data [config]="config()"></bey-account-data>
</div>
