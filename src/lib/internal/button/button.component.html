@let current = button();

@if (!current.isHidden) {
    <span
        class="bey-button-wrapper d-inline-block"
        boundariesElement="viewport"
        container="body"
        [placement]="current.tooltipPlacement ?? 'top'"
        [style]="current.customStyles"
        [tooltip]="current.tooltip | translate"
    >
        <button
            type="button"
            [attr.aria-describedby]="current.describedBy ?? null"
            [attr.aria-label]="current.ariaLabel ? (current.ariaLabel | translate) : null"
            [attr.aria-pressed]="current.isPressed || null"
            [class.is-pressed]="current.isPressed"
            [class]="classes()"
            [disabled]="current.isDisabled"
            (click)="onClick()"
        >
            @if (current.icon) {
                <fa-icon class="bey-button-icon" [class.me-2]="current.label" [icon]="current.icon"></fa-icon>
            }
            @if (current.label) {
                {{ current.label | translate }}
            }
        </button>
    </span>
}
