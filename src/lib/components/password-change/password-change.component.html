@if (profile(); as profile) {
    <bey-settings-section [descriptionKey]="texts().description" [titleKey]="texts().title">
        @if (profile.hasPassword) {
            <bey-form [config]="form()"></bey-form>
        } @else {
            <p class="bey-password-change-note">{{ texts().noPassword | translate }}</p>
        }
    </bey-settings-section>
}
