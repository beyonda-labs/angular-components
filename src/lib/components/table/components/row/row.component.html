<div
    class="bey-table-row"
    role="row"
    [class.bey-table-row--header]="isHeader()"
    [class.bey-table-row--selectable]="selectable() && !isHeader()"
    [class.is-selected]="row().selected"
    [style.grid-template-columns]="gridTemplateColumns()"
    (click)="onRowClick()"
>
    @if (selectable()) {
        <label class="bey-table-row-selection" (click)="$event.stopPropagation()">
            <span class="visually-hidden">{{ selectionLabel() | translate }}</span>
            <input
                class="bey-table-row-checkbox"
                type="checkbox"
                [attr.aria-label]="selectionLabel() | translate"
                [checked]="row().selected"
                [indeterminate]="selectionIndeterminate()"
                (change)="onCheckboxChange($event)"
            />
        </label>
    }

    @for (cell of row().cells; track $index) {
        <bey-table-cell [cell]="cell" [isHeader]="isHeader()"></bey-table-cell>
    }
</div>
