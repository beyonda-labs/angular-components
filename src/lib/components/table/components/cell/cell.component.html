<div
    class="bey-table-cell"
    boundariesElement="viewport"
    container="body"
    placement="top"
    [attr.aria-sort]="sortState()"
    [attr.role]="isHeader() ? 'columnheader' : 'cell'"
    [class.bey-table-cell--header]="isHeader()"
    [tooltip]="tooltipItems().length > 0 ? tooltipList : (tooltip() | translate)"
>
    @if (sortState()) {
        <button class="bey-table-cell-sort" type="button" [class.is-sorted]="isSorted()" (click)="onSortClick($event)">
            <span class="bey-table-cell-content">
                {{ cell().isTranslationKey ? (content() | translate) : content() }}
            </span>
            <fa-icon class="bey-table-cell-sort-icon" [icon]="sortIcon()"></fa-icon>
        </button>
    } @else if (isLink()) {
        <button class="bey-table-cell-link" type="button" (click)="onLinkClick($event)">
            <ng-container [ngTemplateOutlet]="cellIcon"></ng-container>
            <span class="bey-table-cell-content">
                {{ cell().isTranslationKey ? (content() | translate) : content() }}
            </span>
        </button>
    } @else if (isBadge()) {
        <span class="bey-table-cell-content bey-table-cell-badges">
            @for (badge of badges(); track $index) {
                <bey-badge [config]="badge"></bey-badge>
            }
        </span>
    } @else {
        <ng-container [ngTemplateOutlet]="cellIcon"></ng-container>
        <span class="bey-table-cell-content">{{ cell().isTranslationKey ? (content() | translate) : content() }}</span>
    }
</div>

<ng-template #cellIcon>
    @if (icon(); as icon) {
        @let label = iconLabel() | translate;
        <span
            class="bey-table-cell-icon"
            [attr.aria-hidden]="label ? null : 'true'"
            [attr.aria-label]="label || null"
            [attr.role]="label ? 'img' : null"
            [attr.title]="label || null"
        >
            <fa-icon [icon]="icon"></fa-icon>
        </span>
    }
</ng-template>

<ng-template #tooltipList>
    <bey-tooltip-list [items]="tooltipItems()" [title]="tooltip()"></bey-tooltip-list>
</ng-template>
