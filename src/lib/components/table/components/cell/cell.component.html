<div
    class="bey-table-cell"
    boundariesElement="viewport"
    container="body"
    placement="top"
    [attr.role]="isHeader() ? 'columnheader' : 'cell'"
    [class.bey-table-cell--header]="isHeader()"
    [tooltip]="tooltip() | translate"
>
    @if (isLink()) {
        <button class="bey-table-cell-link bey-table-cell-content" type="button" (click)="onLinkClick($event)">
            {{ cell().translate ? (content() | translate) : content() }}
        </button>
    } @else if (isBadge()) {
        <span class="bey-table-cell-content bey-table-cell-badges">
            @for (badge of badges(); track $index) {
                <bey-badge [config]="badge"></bey-badge>
            }
        </span>
    } @else {
        <span class="bey-table-cell-content">{{ cell().translate ? (content() | translate) : content() }}</span>
    }
</div>
