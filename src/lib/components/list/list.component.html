<div class="bey-list" role="list" [style.gap]="config().gap">
    @if (config().items.length) {
        @for (item of config().items; track trackByItem($index, item)) {
            <div
                class="bey-list-item"
                [attr.role]="isClickable() ? 'button' : 'listitem'"
                [attr.tabindex]="isClickable() ? 0 : null"
                [class.is-bare]="config().bare"
                [class.is-clickable]="isClickable()"
                (click)="onItemClick(item, $index)"
                (keydown.enter)="onItemKeydown($event, item, $index)"
                (keydown.space)="onItemKeydown($event, item, $index)"
            >
                <ng-container
                    [ngTemplateOutlet]="cardTemplate() ?? null"
                    [ngTemplateOutletContext]="getItemContext(item, $index)"
                ></ng-container>
            </div>
        }
    } @else {
        <div class="bey-list-empty">{{ emptyLabel() | translate }}</div>
    }
</div>
