<p class="bey-style-guide-description text-muted mb-3">
    {{ 'angular-components-style-guide.list.example' | translate }}
</p>

<bey-list class="mb-4" [config]="config">
    <ng-template let-employee>
        <div class="d-flex align-items-center gap-3">
            <div
                class="d-flex align-items-center justify-content-center rounded-circle fw-semibold"
                style="
                    width: 2.75rem;
                    height: 2.75rem;
                    flex: 0 0 auto;
                    background: var(--bey-primary);
                    color: var(--bey-bg-page);
                "
            >
                {{ getInitials(employee.name) }}
            </div>
            <div>
                <div class="fw-semibold">{{ employee.name }}</div>
                <div class="text-muted small">{{ employee.role }}</div>
            </div>
        </div>
    </ng-template>
</bey-list>

<p class="mb-2">{{ 'angular-components-style-guide.list.empty-example' | translate }}</p>
<bey-list [config]="emptyConfig">
    <ng-template let-employee>
        <div>{{ employee.name }}</div>
    </ng-template>
</bey-list>
