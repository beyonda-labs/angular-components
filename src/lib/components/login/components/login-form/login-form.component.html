<bey-form [config]="formConfig()" />

@if (config().isPasswordResetEnabled) {
    <div class="d-flex justify-content-center mt-2">
        <bey-button [button]="forgotPasswordButton()" />
    </div>
}

@if (unverifiedEmail(); as email) {
    <div class="mt-3">
        <p class="small mb-2">{{ unverifiedMessage() | translate: { email } }}</p>
        <bey-button [button]="resendButton()" />
        <div aria-live="polite" role="status">
            @if (isVerificationResent()) {
                <p class="small mt-2 mb-0">{{ resentMessage() | translate: { email } }}</p>
            }
        </div>
    </div>
}

<bey-login-providers [prefix]="prefix()" [providers]="providers()" (providerClick)="onProvider($event)" />
