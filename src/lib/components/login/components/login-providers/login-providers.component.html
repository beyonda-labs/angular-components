@if (buttons().length > 0) {
    <div class="bey-login-providers-divider" role="separator">
        <span>{{ label() | translate }}</span>
    </div>
    <div class="bey-login-providers-list">
        @for (entry of buttons(); track entry.provider.id) {
            <bey-button [button]="entry.button" />
        }
    </div>
}
