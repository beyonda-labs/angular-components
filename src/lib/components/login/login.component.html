<bey-login-shell [config]="config()" [title]="title()">
    @if (isViewSwitchVisible()) {
        <div class="bey-login-view-switch" aside>
            <bey-button [button]="viewButton()" />
        </div>
    }

    @switch (view()) {
        @case ('register') {
            <bey-login-register-form
                beyLoginAutofocus
                [config]="config()"
                [registerFields]="registerFields()"
                (verificationRequired)="showView('registered')"
            />
        }
        @case ('forgot-password') {
            <bey-login-forgot-password beyLoginAutofocus [config]="config()" />
            <div class="bey-login-back">
                <bey-button [button]="backButton()" />
            </div>
        }
        @case ('registered') {
            <div beyLoginAutofocus>
                <p class="mb-0" aria-live="polite" role="status">{{ registeredMessage() | translate }}</p>
                <div class="bey-login-back">
                    <bey-button [button]="backButton()" />
                </div>
            </div>
        }
        @default {
            <bey-login-form
                beyLoginAutofocus
                [config]="config()"
                [providers]="providers()"
                (forgotPasswordClick)="showView('forgot-password')"
            />
        }
    }
</bey-login-shell>
