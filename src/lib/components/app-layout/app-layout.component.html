<div class="bey-app-layout d-flex">
    <bey-left-menu class="bey-app-layout-menu" [config]="leftMenuConfig()"></bey-left-menu>

    <main
        class="bey-app-layout-content d-flex flex-column"
        [attr.aria-label]="'angular-components.app-layout.main-content' | translate"
    >
        @if (breadcrumbConfig(); as breadcrumb) {
            <div class="bey-app-layout-breadcrumb">
                <bey-breadcrumb [config]="breadcrumb"></bey-breadcrumb>
            </div>
        }

        <div class="bey-app-layout-body d-flex flex-column">
            <div class="bey-app-layout-body-content flex-fill" [class.has-padding]="config().useBodyPadding">
                <ng-content></ng-content>
            </div>
            <bey-footer class="flex-shrink-0" [config]="config().footerConfig" />
        </div>
    </main>
</div>
