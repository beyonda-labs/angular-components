<textarea
    class="form-control form-control-sm bey-form-field-control bey-form-textarea"
    [id]="field().key"
    [formControl]="control()"
    [rows]="field().rows"
    [style.max-height]="field().maxHeight ?? null"
    [placeholder]="placeholder() | translate"
    [attr.aria-required]="field().isRequired || null"
    [attr.aria-invalid]="isInvalid() || null"
></textarea>
