<div class="bey-form-autocomplete">
    <div class="bey-form-autocomplete-control">
        <input
            #queryInput
            class="form-control form-control-sm bey-form-field-control bey-form-autocomplete-input"
            autocomplete="off"
            role="combobox"
            type="text"
            [attr.aria-controls]="field().key + '-options'"
            [attr.aria-expanded]="isPanelVisible()"
            [attr.aria-invalid]="isInvalid() || null"
            [attr.aria-required]="isRequired() || null"
            [class.is-invalid]="isInvalid()"
            [disabled]="isDisabled()"
            [id]="field().key"
            [placeholder]="placeholder() | translate"
            [value]="displayValue()"
            (blur)="onBlur()"
            (focus)="onFocus()"
            (input)="onQueryInput($event)"
            (keydown)="onKeydown($event)"
        />

        @if (hasValue() && !isDisabled()) {
            <button
                class="bey-form-field-action bey-form-autocomplete-action bey-form-autocomplete-clear"
                type="button"
                [attr.aria-label]="'angular-components.form.autocomplete-field.clear' | translate"
                (mousedown)="onClear($event)"
            >
                <fa-icon aria-hidden="true" [icon]="clearIcon"></fa-icon>
            </button>
        }

        <button
            class="bey-form-field-action bey-form-autocomplete-action bey-form-autocomplete-toggle"
            tabindex="-1"
            type="button"
            [attr.aria-label]="'angular-components.form.autocomplete-field.toggle' | translate"
            [class.is-open]="isOpen()"
            [disabled]="isDisabled()"
            (mousedown)="onToggle()"
        >
            <fa-icon aria-hidden="true" [icon]="toggleIcon"></fa-icon>
        </button>
    </div>

    @if (isPanelVisible()) {
        <div #panel class="bey-form-autocomplete-panel" role="listbox" [id]="field().key + '-options'">
            @for (option of filteredOptions(); track option.value) {
                <button
                    class="bey-form-autocomplete-option"
                    role="option"
                    type="button"
                    [attr.aria-selected]="isSelected(option)"
                    [class.is-active]="$index === activeIndex()"
                    [class.is-selected]="isSelected(option)"
                    [disabled]="option.isDisabled ?? false"
                    (mousedown)="onOptionPicked(option, $event)"
                >
                    {{ optionLabel(option) }}
                </button>
            } @empty {
                <p class="bey-form-autocomplete-empty">{{ emptyKey() | translate }}</p>
            }
        </div>
    }
</div>
