@if (field) {
    <div class="bey-info-field">
        @for (item of field.items; track $index) {
            <span class="bey-info-field-item">
                @if (item.icon) {
                    <fa-icon class="bey-info-field-icon" [icon]="item.icon"></fa-icon>
                }
                <span class="bey-info-field-label">{{ item.label }}</span>
            </span>
        }
    </div>
}
