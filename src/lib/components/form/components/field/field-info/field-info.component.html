<div class="bey-form-info">
    @for (item of field().items; track $index) {
        <span class="bey-form-info-item">
            @if (item.icon) {
                <fa-icon class="bey-form-info-icon" [icon]="item.icon"></fa-icon>
            }
            <span>{{ item.label }}</span>
        </span>
    }
</div>
