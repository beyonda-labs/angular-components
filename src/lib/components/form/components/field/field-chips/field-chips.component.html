<div
    class="form-control form-control-sm bey-form-field-control bey-form-chips"
    [attr.aria-invalid]="isInvalid() || null"
    [attr.aria-required]="isRequired() || null"
    [class.is-disabled]="isDisabled()"
    [class.is-invalid]="isInvalid()"
>
    @for (chip of chips(); track $index) {
        <span class="bey-form-chips-chip">
            <span class="bey-form-chips-chip-label">{{ chip }}</span>
            @if (!isDisabled()) {
                <button
                    class="bey-form-field-action bey-form-chips-chip-remove"
                    type="button"
                    [attr.aria-label]="'angular-components.form.chips.remove' | translate"
                    (click)="removeChip($index)"
                >
                    <fa-icon aria-hidden="true" [icon]="removeIcon"></fa-icon>
                </button>
            }
        </span>
    }
    <input
        class="bey-form-chips-input"
        type="text"
        [disabled]="isDisabled() || isMaxItemsReached()"
        [id]="field().key"
        [placeholder]="(chips().length ? '' : placeholder()) | translate"
        [value]="inputValue()"
        (blur)="onBlur()"
        (input)="onInput($event)"
        (keydown)="onKeyDown($event)"
    />
</div>
