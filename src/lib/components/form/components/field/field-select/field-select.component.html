<select
    class="form-select form-select-sm bey-form-field-control"
    [id]="field().key"
    [formControl]="control()"
    [attr.aria-required]="field().isRequired || null"
    [attr.aria-invalid]="isInvalid() || null"
>
    <option value="" disabled>{{ placeholder() | translate }}</option>
    @for (option of options(); track option.value) {
        <option [value]="option.value" [disabled]="option.isDisabled ?? false">
            {{ option.label | translate }}
        </option>
    }
</select>
