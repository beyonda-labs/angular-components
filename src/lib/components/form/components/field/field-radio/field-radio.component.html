<div
    class="bey-form-radio"
    role="radiogroup"
    [attr.aria-invalid]="isInvalid() || null"
    [attr.aria-required]="field().isRequired || null"
>
    @for (option of options(); track option.value) {
        <div class="form-check bey-form-field-check">
            <input
                class="form-check-input bey-form-field-check-input"
                type="radio"
                [disabled]="option.isDisabled ?? false"
                [formControl]="control()"
                [id]="field().key + '_' + option.value"
                [name]="field().key"
                [value]="option.value"
            />
            <label class="form-check-label bey-form-field-check-label" [for]="field().key + '_' + option.value">
                {{ option.label | translate }}
            </label>
        </div>
    }
</div>
