<div
    role="group"
    [attr.aria-invalid]="isInvalid() || null"
    [attr.aria-label]="label() | translate"
    [attr.aria-required]="isRequired() || null"
    [id]="field().key"
>
    @for (option of options(); track option.value) {
        <div class="form-check bey-form-field-check">
            <input
                class="form-check-input bey-form-field-check-input"
                type="checkbox"
                [checked]="isChecked(option.value)"
                [disabled]="isDisabled(option)"
                [id]="field().key + '_' + option.value"
                (blur)="onBlur()"
                (change)="toggle(option.value, $any($event.target).checked)"
            />
            <label class="form-check-label bey-form-field-check-label" [for]="field().key + '_' + option.value">
                {{ option.label | translate }}
            </label>
        </div>
    }
</div>
