<div class="bey-form-password">
    <input
        class="form-control form-control-sm bey-form-field-control bey-form-password-input"
        [class.has-toggle]="field().showToggle"
        [type]="isVisible() ? 'text' : 'password'"
        [id]="field().key"
        [formControl]="control()"
        [placeholder]="placeholder() | translate"
        [attr.aria-required]="field().isRequired || null"
        [attr.aria-invalid]="isInvalid() || null"
    />

    @if (field().showToggle) {
        <button
            type="button"
            class="bey-form-field-action bey-form-password-toggle"
            tabindex="-1"
            [attr.aria-label]="toggleLabel() | translate"
            [attr.aria-pressed]="isVisible()"
            (click)="toggleVisibility()"
        >
            <fa-icon [icon]="toggleIcon()" size="sm"></fa-icon>
        </button>
    }
</div>
