<div class="bey-form-number">
    <input
        class="form-control form-control-sm bey-form-field-control bey-form-number-input"
        type="number"
        [attr.aria-invalid]="isInvalid() || null"
        [attr.aria-required]="field().isRequired || null"
        [attr.max]="field().max ?? null"
        [attr.min]="field().min ?? null"
        [formControl]="control()"
        [id]="field().key"
        [placeholder]="placeholder() | translate"
    />

    <div class="bey-form-number-spinners">
        <button
            class="bey-form-field-action bey-form-number-spin"
            tabindex="-1"
            type="button"
            [attr.aria-label]="'angular-components.form.number-field.increment' | translate"
            [disabled]="isIncrementDisabled()"
            (click)="increment()"
        >
            <svg class="bey-form-number-spin-icon" aria-hidden="true" fill="currentColor" viewBox="0 0 10 6">
                <path d="M5 0 10 6H0z" />
            </svg>
        </button>
        <button
            class="bey-form-field-action bey-form-number-spin"
            tabindex="-1"
            type="button"
            [attr.aria-label]="'angular-components.form.number-field.decrement' | translate"
            [disabled]="isDecrementDisabled()"
            (click)="decrement()"
        >
            <svg class="bey-form-number-spin-icon" aria-hidden="true" fill="currentColor" viewBox="0 0 10 6">
                <path d="M5 6 0 0h10z" />
            </svg>
        </button>
    </div>
</div>
