<div
    class="bey-form-option-picker"
    role="listbox"
    [attr.aria-label]="'angular-components.form.text-variable-field.label' | translate"
>
    @if (searchable()) {
        <div class="bey-form-option-picker-header">
            <div class="bey-form-option-picker-search">
                <fa-icon class="bey-form-option-picker-search-icon" [icon]="searchIcon"></fa-icon>
                <input
                    type="text"
                    class="bey-form-option-picker-search-input"
                    autocomplete="off"
                    [attr.aria-label]="'angular-components.form.text-variable-field.search' | translate"
                    [value]="searchTerm()"
                    (input)="onSearchTermChange($event)"
                />
            </div>

            <button
                type="button"
                class="bey-form-option-picker-close"
                [attr.aria-label]="'angular-components.form.text-variable-field.close' | translate"
                (click)="closed.emit()"
            >
                <fa-icon [icon]="closeIcon"></fa-icon>
            </button>
        </div>
    }

    <div class="bey-form-option-picker-list">
        @for (option of visibleOptions(); track option.value; let index = $index) {
            <button
                type="button"
                role="option"
                class="bey-form-option-picker-row"
                [class.is-active]="index === activeIndex()"
                [attr.aria-selected]="index === activeIndex()"
                (click)="selectOption(option)"
                (mouseenter)="activeIndex.set(index)"
            >
                <span
                    class="bey-form-option-picker-row-label"
                    [tooltip]="option.label"
                    container="body"
                    placement="top"
                >
                    {{ option.label }}
                </span>
                @if (option.badge) {
                    <span class="bey-form-option-picker-row-badge">{{ option.badge | translate }}</span>
                }
            </button>
        } @empty {
            <div class="bey-form-option-picker-empty">
                {{ 'angular-components.form.text-variable-field.empty' | translate }}
            </div>
        }
    </div>
</div>
