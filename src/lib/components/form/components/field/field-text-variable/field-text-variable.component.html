<div #anchor class="bey-form-text-variable">
    <input
        class="form-control form-control-sm bey-form-field-control bey-form-text-variable-input"
        type="text"
        [attr.aria-describedby]="describedBy()"
        [attr.aria-invalid]="isInvalid() || null"
        [attr.aria-required]="isRequired() || null"
        [formControl]="control()"
        [id]="field().key"
        [placeholder]="placeholder() | translate"
        (blur)="trackSelection($event)"
        (keyup)="trackSelection($event)"
        (mouseup)="trackSelection($event)"
        (select)="trackSelection($event)"
    />
    <button
        class="bey-form-field-action bey-form-text-variable-toggle"
        container="body"
        tabindex="-1"
        type="button"
        [attr.aria-expanded]="isPickerOpen()"
        [attr.aria-label]="insertLabel | translate"
        [class.is-active]="isPickerOpen()"
        [tooltip]="insertLabel | translate"
        (click)="togglePicker()"
    >
        <fa-icon size="sm" [icon]="variableIcon"></fa-icon>
    </button>

    @if (isPickerOpen()) {
        <bey-option-picker
            [anchor]="anchor"
            [options]="options()"
            (closed)="closePicker()"
            (selected)="onOptionSelected($event)"
        ></bey-option-picker>
    }
</div>
