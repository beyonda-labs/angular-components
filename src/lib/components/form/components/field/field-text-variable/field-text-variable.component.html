@if (field && control) {
    <div class="bey-text-variable-wrapper" #pickerAnchor>
        <input
            class="form-control form-control-sm"
            type="text"
            [id]="field.key"
            [formControl]="control"
            placeholder="{{ getPlaceholder() | translate }}"
            [attr.aria-required]="field.isRequired || null"
            [attr.aria-invalid]="isInvalid() || null"
            (blur)="onBlur($event)"
            (keyup)="onKeyup($event)"
            (mouseup)="onSelect($event)"
            (select)="onSelect($event)"
        />
        <button
            type="button"
            class="bey-text-variable-toggle"
            [class.bey-text-variable-toggle-active]="pickerOpen"
            tabindex="-1"
            [attr.aria-label]="'angular-components.form.textVariableField.insertVariable' | translate"
            [tooltip]="'angular-components.form.textVariableField.insertVariable' | translate"
            container="body"
            (click)="togglePicker()"
        >
            <fa-icon [icon]="variableIcon" size="sm"></fa-icon>
        </button>

        @if (pickerOpen) {
            <bey-form-option-picker
                [anchor]="pickerAnchor"
                [options]="field.options"
                (closed)="closePicker()"
                (selected)="onOptionSelected($event)"
            ></bey-form-option-picker>
        }
    </div>
}
