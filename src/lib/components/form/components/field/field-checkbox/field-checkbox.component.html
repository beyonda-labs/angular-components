<div class="form-check bey-form-field-check">
    @if (field().isSwitch) {
        <span class="bey-form-checkbox-switch">
            <input
                class="bey-form-checkbox-switch-input"
                role="switch"
                type="checkbox"
                [attr.aria-invalid]="isInvalid() || null"
                [attr.aria-label]="field().isLabelVisible ? null : (label() | translate)"
                [attr.aria-required]="isRequired() || null"
                [formControl]="control()"
                [id]="field().key"
            />
            <span class="bey-form-checkbox-switch-knob" aria-hidden="true"></span>
        </span>
    } @else {
        <input
            class="form-check-input bey-form-field-check-input"
            type="checkbox"
            [attr.aria-invalid]="isInvalid() || null"
            [attr.aria-label]="field().isLabelVisible ? null : (label() | translate)"
            [attr.aria-required]="isRequired() || null"
            [formControl]="control()"
            [id]="field().key"
        />
    }

    @if (field().isLabelVisible) {
        <label class="form-check-label bey-form-field-check-label" [for]="field().key">{{ label() | translate }}</label>
    }
</div>
