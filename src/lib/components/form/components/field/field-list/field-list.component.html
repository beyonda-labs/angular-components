@if (items().length > 0) {
    <ul class="bey-form-list" [attr.aria-label]="label() | translate" [id]="field().key">
        @for (item of items(); track $index) {
            <li class="bey-form-list-item">{{ item }}</li>
        }
    </ul>
} @else {
    <p class="bey-form-list-empty">{{ placeholder() | translate }}</p>
}
