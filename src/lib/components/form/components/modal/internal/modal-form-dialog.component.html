<div class="bey-modal-form">
    <div class="bey-modal-form-header">
        <span class="bey-modal-form-icon" aria-hidden="true">
            <fa-icon [icon]="icon"></fa-icon>
        </span>

        <div class="bey-modal-form-heading">
            <div class="bey-modal-form-type">{{ typeLabel | translate }}</div>
            <h2 class="bey-modal-form-title">{{ config.title | translate }}</h2>
        </div>

        <button
            type="button"
            class="bey-modal-form-close btn btn-sm"
            [attr.aria-label]="'angular-components.modal.actions.close' | translate"
            (click)="requestClose()"
        >
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div class="bey-modal-form-body">
        <bey-form [config]="config"></bey-form>
    </div>
</div>
