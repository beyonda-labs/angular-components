<div class="row" [class.justify-content-end]="row().alignment === 'end'">
    @for (entry of fields(); track entry.field.key) {
        <bey-form-field
            [class]="'col-' + entry.field.columns"
            [control]="entry.control"
            [field]="entry.field"
            [prefix]="prefix()"
            [state]="entry.state"
        ></bey-form-field>
    }
</div>
