<div class="bey-form-section">
    @if (section().isTitleVisible) {
        <p
            class="bey-form-section-title"
            [tooltip]="tooltip() | translate"
            placement="right"
            container="body"
            boundariesElement="viewport"
        >
            {{ label() | translate }}
        </p>
    }

    @for (row of visibleRows(); track $index) {
        <bey-form-row
            class="bey-form-section-row"
            [fieldStates]="fieldStates()"
            [group]="group()"
            [prefix]="sectionPrefix()"
            [row]="row"
            [sectionKey]="section().key"
        ></bey-form-row>
    }
</div>
