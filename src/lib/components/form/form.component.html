<div class="bey-form">
    <div class="bey-form-sections bey-thin-scroll">
        @for (section of visibleSections(); track section.key) {
            <bey-form-section
                [fieldStates]="fieldStates()"
                [group]="sectionGroup(section)"
                [prefix]="config().prefix"
                [section]="section"
            ></bey-form-section>
        }
    </div>

    @if (buttons().length > 0) {
        <div
            class="bey-form-buttons"
            [class.bey-form-buttons--divided]="isFooterDivided()"
            [class.bey-form-buttons--footer]="hasFooter()"
            [class.bey-form-buttons--stretch]="config().buttonLayout === 'stretch'"
        >
            @if (footerNote(); as note) {
                <p class="bey-form-buttons-note" [id]="noteId">
                    <fa-icon class="bey-form-buttons-note-icon" aria-hidden="true" [icon]="noteIcon"></fa-icon>
                    <span>{{ note | translate }}</span>
                </p>
            }

            @for (button of buttons(); track button.label) {
                <bey-button [button]="button"></bey-button>
            }
        </div>
    }
</div>
