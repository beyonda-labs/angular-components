<div class="bey-floating-preferences" [class.is-pill]="usePill()">
    <span class="bey-floating-preferences-select">
        <span class="bey-floating-preferences-control">
            <select
                [value]="language()"
                [attr.aria-label]="'angular-components.floating-preferences.language' | translate"
                (change)="onLangChange($any($event.target).value)"
            >
                <option value="es">Español</option>
                <option value="en">English</option>
            </select>
            <span class="bey-floating-preferences-chevron" aria-hidden="true">
                <fa-icon [icon]="chevronIcon"></fa-icon>
            </span>
        </span>
    </span>

    <span class="bey-floating-preferences-select">
        <span class="bey-floating-preferences-control">
            <select
                [value]="theme()"
                [attr.aria-label]="'angular-components.floating-preferences.theme' | translate"
                (change)="onThemeChange($any($event.target).value)"
            >
                <option value="light">{{ 'angular-components.floating-preferences.light' | translate }}</option>
                <option value="dark">{{ 'angular-components.floating-preferences.dark' | translate }}</option>
            </select>
            <span class="bey-floating-preferences-chevron" aria-hidden="true">
                <fa-icon [icon]="chevronIcon"></fa-icon>
            </span>
        </span>
    </span>
</div>
