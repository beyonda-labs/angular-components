<ng-template #renderNodes let-level="level" let-nodes>
    @for (node of nodes; track node.id) {
        <div class="bey-property-tree-node">
            <div
                class="bey-property-tree-row"
                role="treeitem"
                [attr.aria-disabled]="node.disabled || null"
                [attr.aria-expanded]="hasVisibleChildren(node) ? node.expanded : null"
                [attr.aria-selected]="isSelected(node)"
                [attr.data-node-id]="node.id"
                [attr.tabindex]="node.disabled ? -1 : 0"
                [class.is-disabled]="node.disabled"
                [class.is-draggable]="node.draggable"
                [class.is-dragged]="isDragged(node)"
                [class.is-drop-after]="dropPositionFor(node) === 'after'"
                [class.is-drop-before]="dropPositionFor(node) === 'before'"
                [class.is-drop-inside]="dropPositionFor(node) === 'inside'"
                [class.is-drop-invalid]="isInvalidTarget(node)"
                [class.is-selected]="isSelected(node)"
                [style.--bey-property-tree-level]="level"
                (click)="onNodeClick(node)"
                (keydown)="onRowKeyDown($event, node)"
                (pointerdown)="onRowPointerDown($event, node)"
            >
                @if (hasVisibleChildren(node)) {
                    <button
                        class="bey-property-tree-toggle"
                        tabindex="-1"
                        type="button"
                        [attr.aria-label]="toggleLabelKey(node) | translate"
                        [disabled]="node.disabled"
                        (click)="onToggleClick($event, node)"
                    >
                        <fa-icon
                            class="bey-property-tree-chevron"
                            [class.is-expanded]="node.expanded"
                            [icon]="chevronIcon"
                        ></fa-icon>
                    </button>
                } @else {
                    <span class="bey-property-tree-toggle" aria-hidden="true"></span>
                }

                @if (node.icon) {
                    <span class="bey-property-tree-icon">
                        <fa-icon [icon]="node.icon"></fa-icon>
                    </span>
                }

                <span class="bey-property-tree-label">{{ labelKey(node) | translate: node.labelParameters }}</span>
            </div>

            @if (node.expanded && hasVisibleChildren(node)) {
                <ng-container
                    [ngTemplateOutlet]="renderNodes"
                    [ngTemplateOutletContext]="{ $implicit: visibleChildren(node), level: level + 1 }"
                ></ng-container>
            }
        </div>
    }
</ng-template>

<div class="bey-property-tree" role="tree">
    <ng-container
        [ngTemplateOutlet]="renderNodes"
        [ngTemplateOutletContext]="{ $implicit: visibleNodes(), level: 0 }"
    ></ng-container>

    @if (addBlockLabel(); as label) {
        <button class="bey-property-tree-add-block" type="button" (click)="onAddBlockClick()">
            <fa-icon [icon]="addIcon"></fa-icon>
            <span>{{ label | translate }}</span>
        </button>
    }
</div>
