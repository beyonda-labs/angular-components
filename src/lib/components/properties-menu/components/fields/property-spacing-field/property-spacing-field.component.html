@let current = field();

<div
    class="bey-property-spacing-field"
    role="group"
    [attr.aria-label]="labelling().labelId ? null : (labelling().labelKey | translate)"
    [attr.aria-labelledby]="labelling().labelId"
>
    @for (side of sides; track side) {
        <label class="bey-property-spacing-field-side">
            <span class="bey-property-spacing-field-side-label">
                {{ 'angular-components.properties-menu.spacing-field.' + side | translate }}
            </span>
            <input
                class="bey-property-field-input"
                step="any"
                type="number"
                [disabled]="current.disabled"
                [readOnly]="current.readonly"
                [value]="spacing()[side]"
                (input)="onSideChange(side, $event)"
            />
        </label>
    }
</div>
