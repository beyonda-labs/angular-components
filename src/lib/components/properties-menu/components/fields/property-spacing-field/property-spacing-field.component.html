<div class="bey-property-spacing-field" role="group" [attr.aria-label]="field.label">
    <label class="bey-property-spacing-field-side">
        <span class="bey-property-spacing-field-side-label">
            {{ 'angular-components.properties-menu.spacing.top' | translate }}
        </span>
        <input
            type="number"
            class="bey-property-field-input"
            [disabled]="field.disabled"
            [readOnly]="field.readonly"
            [value]="spacing.top"
            (input)="onSideChange('top', $event)"
        />
    </label>

    <label class="bey-property-spacing-field-side">
        <span class="bey-property-spacing-field-side-label">
            {{ 'angular-components.properties-menu.spacing.right' | translate }}
        </span>
        <input
            type="number"
            class="bey-property-field-input"
            [disabled]="field.disabled"
            [readOnly]="field.readonly"
            [value]="spacing.right"
            (input)="onSideChange('right', $event)"
        />
    </label>

    <label class="bey-property-spacing-field-side">
        <span class="bey-property-spacing-field-side-label">
            {{ 'angular-components.properties-menu.spacing.bottom' | translate }}
        </span>
        <input
            type="number"
            class="bey-property-field-input"
            [disabled]="field.disabled"
            [readOnly]="field.readonly"
            [value]="spacing.bottom"
            (input)="onSideChange('bottom', $event)"
        />
    </label>

    <label class="bey-property-spacing-field-side">
        <span class="bey-property-spacing-field-side-label">
            {{ 'angular-components.properties-menu.spacing.left' | translate }}
        </span>
        <input
            type="number"
            class="bey-property-field-input"
            [disabled]="field.disabled"
            [readOnly]="field.readonly"
            [value]="spacing.left"
            (input)="onSideChange('left', $event)"
        />
    </label>
</div>
