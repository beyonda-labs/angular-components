@let current = field();
@let label = labelling().labelKey | translate;

<div
    class="bey-property-number-array-field"
    role="group"
    [attr.aria-label]="labelling().labelId ? null : (labelling().labelKey | translate)"
    [attr.aria-labelledby]="labelling().labelId"
>
    @for (entry of entries(); track $index) {
        <div class="bey-property-number-array-field-entry">
            <input
                class="bey-property-field-input"
                type="number"
                [attr.aria-label]="
                    'angular-components.properties-menu.number-array-field.entry'
                        | translate: { label: label, position: $index + 1 }
                "
                [attr.max]="current.max"
                [attr.min]="current.min"
                [attr.step]="current.step ?? 'any'"
                [disabled]="current.disabled"
                [value]="entry"
                (input)="onEntryChange($index, $event)"
            />

            @if (canRemove()) {
                <button
                    class="bey-property-field-action"
                    type="button"
                    [attr.aria-label]="
                        'angular-components.properties-menu.number-array-field.remove-entry'
                            | translate: { label: label, position: $index + 1 }
                    "
                    [disabled]="current.disabled"
                    (click)="onRemove($index)"
                >
                    <fa-icon [icon]="removeIcon"></fa-icon>
                </button>
            }
        </div>
    }

    @if (canAdd()) {
        <button
            class="bey-property-field-action bey-property-number-array-field-add"
            type="button"
            [disabled]="current.disabled"
            (click)="onAdd()"
        >
            <fa-icon [icon]="addIcon"></fa-icon>
            <span>{{ 'angular-components.properties-menu.number-array-field.add' | translate }}</span>
        </button>
    }
</div>
