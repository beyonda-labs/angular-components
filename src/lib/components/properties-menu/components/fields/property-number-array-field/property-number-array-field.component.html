<div class="bey-property-number-array-field" role="group" [attr.aria-label]="field.label">
    @for (entry of entries; track $index) {
        <div class="bey-property-number-array-field-entry">
            <input
                type="number"
                class="bey-property-field-input"
                [attr.step]="field.step ?? 'any'"
                [attr.min]="field.min"
                [attr.max]="field.max"
                [disabled]="field.disabled"
                [value]="entry"
                (input)="onEntryChange($index, $event)"
            />

            @if (canRemove) {
                <button
                    type="button"
                    class="bey-property-number-array-field-remove"
                    [attr.aria-label]="'angular-components.properties-menu.remove' | translate"
                    [disabled]="field.disabled"
                    (click)="onRemove($index)"
                >
                    <fa-icon [icon]="removeIcon"></fa-icon>
                </button>
            }
        </div>
    }

    @if (canAdd) {
        <button type="button" class="bey-property-number-array-field-add" [disabled]="field.disabled" (click)="onAdd()">
            <fa-icon [icon]="addIcon"></fa-icon>
            <span>{{ 'angular-components.properties-menu.numberArray.add' | translate }}</span>
        </button>
    }
</div>
