@let current = field();

<label class="bey-property-toggle-field">
    <input
        class="bey-property-toggle-field-input"
        type="checkbox"
        [attr.aria-label]="labelling().labelId ? null : (labelling().labelKey | translate)"
        [checked]="current.value ?? false"
        [disabled]="current.isDisabled"
        [id]="labelling().controlId"
        [required]="current.isRequired"
        (change)="onChange($event)"
    />
    <span class="bey-property-toggle-field-track">
        <span class="bey-property-toggle-field-thumb"></span>
    </span>
</label>
