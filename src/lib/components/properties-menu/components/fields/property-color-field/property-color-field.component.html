@let current = field();

<div class="bey-property-field-control">
    <label
        class="bey-property-color-field-swatch"
        [class.is-empty]="!hasValue()"
        [style.backgroundColor]="hasValue() ? pickerValue() : null"
    >
        <input
            type="color"
            class="bey-property-color-field-swatch-input"
            [attr.aria-label]="current.label"
            [disabled]="current.disabled"
            [value]="pickerValue()"
            (input)="onInputChange($event)"
        />
    </label>

    <input
        type="text"
        class="bey-property-field-input"
        [attr.aria-label]="current.label + ' hex value'"
        [disabled]="current.disabled"
        [readOnly]="current.readonly"
        [value]="current.value ?? ''"
        (change)="onInputChange($event)"
    />

    @if (showsClear()) {
        <div class="bey-property-field-actions">
            <button
                type="button"
                class="bey-property-field-action"
                [attr.aria-label]="'angular-components.properties-menu.color-field.clear' | translate"
                [tooltip]="'angular-components.properties-menu.color-field.clear' | translate"
                container="body"
                (click)="onClear()"
            >
                <fa-icon [icon]="clearIcon"></fa-icon>
            </button>
        </div>
    }
</div>
