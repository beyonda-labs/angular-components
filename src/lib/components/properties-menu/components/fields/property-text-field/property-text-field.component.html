@let current = field();

<div class="bey-property-field-control">
    <div class="bey-property-field-anchor" #pickerAnchor>
        @if (current.multiline) {
            <textarea
                class="bey-property-field-input"
                [class.bey-property-field-input--with-actions]="current.acceptsVariable && current.actionButton"
                rows="3"
                [attr.aria-label]="current.label"
                [disabled]="current.disabled"
                [placeholder]="current.placeholder"
                [readonly]="current.readonly"
                [required]="current.required"
                [value]="current.value ?? ''"
                (blur)="trackSelection($event)"
                (input)="onInput($event)"
                (keyup)="trackSelection($event)"
                (mouseup)="trackSelection($event)"
                (select)="trackSelection($event)"
            ></textarea>
        } @else {
            <input
                type="text"
                class="bey-property-field-input"
                [attr.aria-label]="current.label"
                [disabled]="current.disabled"
                [placeholder]="current.placeholder"
                [readOnly]="current.readonly"
                [required]="current.required"
                [value]="current.value ?? ''"
                (blur)="trackSelection($event)"
                (input)="onInput($event)"
                (keyup)="trackSelection($event)"
                (mouseup)="trackSelection($event)"
                (select)="trackSelection($event)"
            />
        }

        @if (pickerOpen()) {
            <bey-option-picker
                [anchor]="pickerAnchor"
                [options]="variableOptions()"
                (closed)="closePicker()"
                (selected)="onVariableSelected($event)"
            ></bey-option-picker>
        }
    </div>

    @if (showsActions()) {
        <div class="bey-property-field-actions">
            @if (current.acceptsVariable) {
                <button
                    type="button"
                    class="bey-property-field-action"
                    [class.is-active]="pickerOpen()"
                    [attr.aria-label]="insertLabel | translate"
                    [attr.aria-expanded]="pickerOpen()"
                    [disabled]="current.disabled"
                    [tooltip]="insertLabel | translate"
                    container="body"
                    (click)="togglePicker()"
                >
                    <fa-icon [icon]="variableIcon"></fa-icon>
                </button>
            }

            @if (current.actionButton && hasSelection()) {
                <button
                    type="button"
                    class="bey-property-field-action"
                    [attr.aria-label]="actionButtonTooltipKey() | translate"
                    [disabled]="current.disabled"
                    [tooltip]="actionButtonTooltipKey() | translate"
                    container="body"
                    (click)="onActionButtonClick()"
                >
                    <fa-icon [icon]="current.actionButton.icon"></fa-icon>
                </button>
            }
        </div>
    }
</div>
