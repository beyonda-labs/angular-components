@let current = field();

@if (current.searchable) {
    <div #pickerAnchor class="bey-property-field-control bey-property-select-field">
        <input
            class="bey-property-field-input"
            autocomplete="off"
            role="combobox"
            type="text"
            [attr.aria-controls]="optionsId()"
            [attr.aria-expanded]="isOpen()"
            [attr.aria-label]="labelling().labelId ? null : (labelling().labelKey | translate)"
            [disabled]="current.disabled"
            [id]="labelling().controlId"
            [placeholder]="'angular-components.properties-menu.select-field.search' | translate"
            [required]="current.required"
            [value]="inputValue()"
            (blur)="close()"
            (focus)="onFocus()"
            (input)="onQueryInput($event)"
            (keydown)="onKeydown($event)"
        />

        @if (isOpen()) {
            <div
                class="bey-property-select-field-panel"
                role="listbox"
                [attr.aria-label]="labelling().labelId ? null : (labelling().labelKey | translate)"
                [attr.aria-labelledby]="labelling().labelId"
                [id]="optionsId()"
            >
                @for (option of filteredOptions(); track option.value) {
                    <button
                        class="bey-property-select-field-option"
                        role="option"
                        type="button"
                        [attr.aria-selected]="option.value === current.value"
                        [class.is-selected]="option.value === current.value"
                        [disabled]="option.disabled"
                        (mousedown)="onOptionPicked(option, $event)"
                    >
                        {{ option.label | translate }}
                    </button>
                } @empty {
                    <p class="bey-property-select-field-empty">
                        {{ 'angular-components.properties-menu.select-field.no-matches' | translate }}
                    </p>
                }
            </div>
        }

        @if (pickerOpen()) {
            <bey-option-picker
                [anchor]="pickerAnchor"
                [options]="variableOptions()"
                (closed)="closeVariablePicker()"
                (selected)="onVariableSelected($event)"
            ></bey-option-picker>
        }

        @if (current.variables.length > 0) {
            <button
                class="bey-property-field-action"
                container="body"
                type="button"
                [attr.aria-expanded]="pickerOpen()"
                [attr.aria-label]="'angular-components.properties-menu.select-field.use-variable' | translate"
                [class.is-active]="pickerOpen()"
                [disabled]="current.disabled"
                [tooltip]="'angular-components.properties-menu.select-field.use-variable' | translate"
                (click)="toggleVariablePicker()"
            >
                <fa-icon [icon]="variableIcon"></fa-icon>
            </button>
        }
    </div>
} @else {
    <div class="bey-property-field-control">
        <select
            class="bey-property-field-select"
            [attr.aria-label]="labelling().labelId ? null : (labelling().labelKey | translate)"
            [disabled]="current.disabled"
            [id]="labelling().controlId"
            [required]="current.required"
            (change)="onChange($event)"
        >
            @for (option of current.options; track option.value) {
                <option [disabled]="option.disabled" [selected]="option.value === current.value" [value]="option.value">
                    {{ option.label | translate }}
                </option>
            }
        </select>
    </div>
}
