@let current = field();

<div class="bey-property-segmented-field" role="radiogroup" [attr.aria-label]="current.label">
    @for (option of current.options; track option.value) {
        <button
            class="bey-property-segmented-field-option"
            role="radio"
            type="button"
            [attr.aria-checked]="isActive(option)"
            [attr.aria-label]="option.label | translate"
            [attr.title]="option.icon ? (option.label | translate) : null"
            [class.is-active]="isActive(option)"
            [disabled]="option.disabled || current.disabled"
            [tabindex]="isActive(option) ? 0 : -1"
            (click)="selectOption(option)"
            (keydown)="onKeydown($event)"
        >
            @if (option.icon) {
                <fa-icon [icon]="option.icon"></fa-icon>
            } @else if (option.label) {
                {{ option.label | translate }}
            }
        </button>
    }
</div>
