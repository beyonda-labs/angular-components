@let current = field();

<div class="bey-property-field-control">
    <input
        class="bey-property-field-input"
        type="number"
        [attr.aria-label]="labelling().labelId ? null : (labelling().labelKey | translate)"
        [disabled]="current.isDisabled"
        [id]="labelling().controlId"
        [max]="current.max"
        [min]="current.min"
        [placeholder]="current.placeholder"
        [readOnly]="current.isReadonly"
        [required]="current.isRequired"
        [step]="current.step ?? 1"
        [value]="current.value ?? ''"
        (input)="onInput($event)"
    />

    @if (current.unit) {
        <span class="bey-property-field-unit">{{ current.unit }}</span>
    }
</div>
