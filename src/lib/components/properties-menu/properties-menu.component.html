<section
    class="bey-properties-menu"
    [class.bey-properties-menu--embedded]="config().embedded"
    [attr.aria-label]="titleKey() | translate"
>
    @if (visibleTabs().length > 1) {
        <bey-property-tabs></bey-property-tabs>
    }

    <ng-content></ng-content>

    @if (!config().embedded) {
        <bey-properties-menu-header [config]="headerConfig()"></bey-properties-menu-header>
    }

    <div #menuBody class="bey-properties-menu-body bey-thin-scroll">
        @if (activeTab(); as tab) {
            <bey-property-tab [tab]="tab"></bey-property-tab>
        }
    </div>
</section>
