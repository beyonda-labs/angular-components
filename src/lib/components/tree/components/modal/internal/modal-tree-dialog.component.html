<div class="bey-modal-tree">
    <div class="d-flex align-items-start justify-content-between gap-3">
        <div class="d-flex align-items-start gap-3 grow min-w-0">
            <span class="bey-modal-tree-icon" aria-hidden="true">
                <fa-icon [icon]="getIcon()"></fa-icon>
            </span>

            <div class="min-w-0 grow">
                <h2 class="bey-modal-tree-title">{{ getTitle() | translate }}</h2>
            </div>
        </div>

        <button
            type="button"
            class="btn btn-sm rounded-circle d-inline-flex align-items-center justify-content-center shrink-0 bey-modal-tree-close"
            [attr.aria-label]="'angular-components.modal.actions.close' | translate"
            (click)="dismiss()"
        >
            <span aria-hidden="true">&times;</span>
            <span class="visually-hidden">{{ 'angular-components.modal.actions.close' | translate }}</span>
        </button>
    </div>

    <div class="bey-modal-tree-body mt-3">
        <bey-tree [config]="config.treeConfig"></bey-tree>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4 bey-modal-tree-actions">
        <span class="bey-modal-tree-action-slot">
            <bey-button [button]="getCancelButton()"></bey-button>
        </span>

        <span class="bey-modal-tree-action-slot">
            <bey-button [button]="getConfirmButton()"></bey-button>
        </span>
    </div>
</div>
