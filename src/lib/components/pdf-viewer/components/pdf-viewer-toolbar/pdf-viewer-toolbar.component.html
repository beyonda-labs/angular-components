<div class="bey-pdf-viewer-toolbar">
    <div class="bey-pdf-viewer-toolbar-status">
        <ng-content></ng-content>
    </div>

    <div class="bey-pdf-viewer-toolbar-controls">
        <button
            class="bey-pdf-viewer-toolbar-button btn"
            type="button"
            [attr.aria-label]="'angular-components.pdf-viewer.toolbar.zoom-out' | translate"
            [disabled]="!canZoomOut()"
            [title]="'angular-components.pdf-viewer.toolbar.zoom-out' | translate"
            (click)="zoomOut()"
        >
            <fa-icon aria-hidden="true" [icon]="zoomOutIcon"></fa-icon>
        </button>

        <span class="bey-pdf-viewer-toolbar-zoom" aria-live="polite">{{ zoomPercent() }}%</span>

        <button
            class="bey-pdf-viewer-toolbar-button btn"
            type="button"
            [attr.aria-label]="'angular-components.pdf-viewer.toolbar.zoom-in' | translate"
            [disabled]="!canZoomIn()"
            [title]="'angular-components.pdf-viewer.toolbar.zoom-in' | translate"
            (click)="zoomIn()"
        >
            <fa-icon aria-hidden="true" [icon]="zoomInIcon"></fa-icon>
        </button>

        @if (hasPages()) {
            <input
                #pageField
                class="bey-pdf-viewer-toolbar-page form-control form-control-sm"
                inputmode="numeric"
                min="1"
                type="number"
                [attr.aria-label]="'angular-components.pdf-viewer.toolbar.page' | translate"
                [max]="pagesCount()"
                [value]="page()"
                (change)="onPageInput(pageField)"
            />

            <span class="bey-pdf-viewer-toolbar-pages">/ {{ pagesCount() }}</span>
        }
    </div>
</div>
