<div class="bey-pdf-viewer" (keydown)="onKeydown($event)">
    @if (hasCompactToolbar()) {
        <bey-pdf-viewer-toolbar
            [config]="config()"
            [isSearchOpen]="isSearchOpen()"
            [page]="currentPage()"
            [pagesCount]="pagesCount()"
            [zoom]="zoomFactor()"
            (download)="onDownload()"
            (pageChange)="onToolbarPageChange($event)"
            (searchToggle)="onSearchToggle()"
            (zoomChange)="onToolbarZoomChange($event)"
        >
            <ng-content select="[bey-pdf-viewer-status]"></ng-content>
        </bey-pdf-viewer-toolbar>
    }

    <div class="bey-pdf-viewer-body">
        @if (isSearchOpen()) {
            <bey-pdf-viewer-search
                class="bey-pdf-viewer-search-popup"
                [matches]="searchMatches()"
                [query]="searchQuery()"
                (dismiss)="closeSearch()"
                (next)="onSearchNext()"
                (previous)="onSearchPrevious()"
                (queryChange)="onSearchChange($event)"
            ></bey-pdf-viewer-search>
        }

        <div #frame class="bey-pdf-viewer-frame" tabindex="-1" (click)="onContainerClick($event)">
            <ngx-extended-pdf-viewer
                [backgroundColor]="config().backgroundColor"
                [contextMenuAllowed]="hasFullToolbar()"
                [enableDragAndDrop]="hasFullToolbar()"
                [filenameForDownload]="config().filenameForDownload"
                [height]="config().height"
                [ignoreKeyboard]="!hasFullToolbar()"
                [maxZoom]="config().maxZoom"
                [minZoom]="config().minZoom"
                [page]="currentPage()"
                [password]="config().password"
                [rotation]="currentRotation()"
                [showBorders]="false"
                [showDownloadButton]="config().toolbarButtons.hasDownloadButton"
                [showFindButton]="config().toolbarButtons.hasFindButton"
                [showHandToolButton]="config().toolbarButtons.hasHandToolButton"
                [showOpenFileButton]="config().toolbarButtons.hasOpenFileButton"
                [showPagingButtons]="config().toolbarButtons.hasPagingButtons"
                [showPresentationModeButton]="config().toolbarButtons.hasPresentationModeButton"
                [showPrintButton]="config().toolbarButtons.hasPrintButton"
                [showPropertiesButton]="config().toolbarButtons.hasPropertiesButton"
                [showRotateButton]="config().toolbarButtons.hasRotateButton"
                [showSecondaryToolbarButton]="config().toolbarButtons.hasSecondaryToolbarButton"
                [showSidebarButton]="config().toolbarButtons.hasSidebarButton"
                [showToolbar]="hasFullToolbar()"
                [showZoomButtons]="config().toolbarButtons.hasZoomButtons"
                [showZoomDropdown]="config().toolbarButtons.hasZoomDropdown"
                [src]="config().src"
                [textLayer]="textLayer()"
                [useInlineScripts]="false"
                [zoom]="zoomInput()"
                (currentZoomFactor)="onZoomFactorChange($event)"
                (pageChange)="onPageChange($event)"
                (pageRendered)="onPageRendered($event)"
                (pdfLoaded)="onPdfLoaded($event)"
                (pdfLoadingFailed)="onPdfLoadingFailed($event)"
                (rotationChange)="onRotationChange($event)"
                (updateFindMatchesCount)="onFindMatchesCount($event)"
                (zoomChange)="onZoomModelChange($event)"
            ></ngx-extended-pdf-viewer>
        </div>
    </div>
</div>
